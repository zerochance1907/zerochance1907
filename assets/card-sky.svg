  <text x="28" y="328" style="font:400 16px 'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif;fill:#7d8590">A low-poly airship exploration and trading game</text><text x="28" y="352" style="font:400 16px 'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif;fill:#7d8590">for the browser. Explore the skies and trade cargo</text><text x="28" y="376" style="font:400 16px 'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif;fill:#7d8590">between ports. Still in the hangar, being built.</text>
